name: Offline contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      ENABLE_LIVE_DELIVERY: 'false'
      ENABLE_LIVE_AGENT: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir -e '.[backend,dev]'
      - run: python -B -m pytest tests -q -p no:cacheprovider
      - run: ruff check --no-cache tempoledger tests scripts
      - run: ruff format --check --no-cache tempoledger tests scripts
      - run: python -B scripts/check_release.py --ref HEAD
      - run: python -B -m alembic upgrade head --sql
